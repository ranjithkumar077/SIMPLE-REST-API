<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management API</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-primary fw-bold" href="/">
                <i class="fas fa-graduation-cap fs-3"></i>
                SoftGrowTech Student API
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="fw-bold mb-0">Student Dashboard</h2>
            <a href="/add" class="btn btn-primary px-4 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center gap-2 justify-content-center">
                <i class="fas fa-plus"></i> Add Student
            </a>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group shadow-sm rounded-3 overflow-hidden">
                    <span class="input-group-text bg-dark border-secondary text-light border-end-0"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="form-control bg-dark border-secondary text-light border-start-0 ps-0" placeholder="Search students by name, email, or course...">
                </div>
            </div>
        </div>

        <div id="alertPlaceholder"></div>

        <div class="card bg-dark border-secondary shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold">ID</th>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold">Name</th>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold">Email</th>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold">Course</th>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold">Phone</th>
                                <th class="px-4 py-3 border-bottom border-secondary text-secondary fw-semibold text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">
                            <!-- Data will be populated here by JS -->
                            <tr>
                                <td colspan="6" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2 text-secondary mb-0">Loading students...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
