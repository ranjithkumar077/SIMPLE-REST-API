<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - SoftGrowTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        // Pass student ID from Flask to JS
        const STUDENT_ID = {{ student_id }};
    </script>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-primary fw-bold" href="/">
                <i class="fas fa-graduation-cap fs-3"></i>
                SoftGrowTech Student API
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card bg-dark border-secondary shadow-lg rounded-4">
                    <div class="card-header border-secondary bg-transparent p-4 pb-0 border-0">
                        <h3 class="fw-bold mb-0">Edit Student</h3>
                        <p class="text-secondary mt-1 mb-0">Update the details for this student.</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertPlaceholder"></div>
                        
                        <!-- Loading spinner for initial fetch -->
                        <div id="initialLoading" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-secondary mb-0">Fetching student details...</p>
                        </div>

                        <form id="editStudentForm" class="d-none">
                            <div class="mb-3">
                                <label for="name" class="form-label text-light fw-medium">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control bg-dark border-secondary text-light form-control-lg" id="name" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label text-light fw-medium">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control bg-dark border-secondary text-light form-control-lg" id="email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="course" class="form-label text-light fw-medium">Course</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-book"></i></span>
                                    <input type="text" class="form-control bg-dark border-secondary text-light form-control-lg" id="course" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="phone" class="form-label text-light fw-medium">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control bg-dark border-secondary text-light form-control-lg" id="phone" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm" id="submitBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="submitSpinner"></span>
                                    <i class="fas fa-save me-1" id="submitIcon"></i> Update Student
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/edit_student.js') }}"></script>
</body>
</html>
